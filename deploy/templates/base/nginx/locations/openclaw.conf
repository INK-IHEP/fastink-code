location ~ ^/(?<jobtype>openclaw)/(?<node>[^/]+)/(?<port>\d+)/(?<inkuser>[\w\.]+)(?:/(?<rest>.*))?$ {
    proxy_pass https://$node.ihep.ac.cn$request_uri;

    proxy_ssl_server_name on;
    proxy_ssl_name $node.ihep.ac.cn;

    proxy_set_header Host $node.ihep.ac.cn;
    proxy_set_header Ink-Username $http_ink_username;
    proxy_set_header Ink-Token $http_ink_token;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding gzip;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout    2400s;
    proxy_send_timeout    2400s;
    proxy_connect_timeout 2400s;
    keepalive_timeout     2400s;
}
