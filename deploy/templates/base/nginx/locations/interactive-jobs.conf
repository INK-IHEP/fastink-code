location ~ ^/(?<app>vnc|rootbrowse|jupyter)/(?<node>[^/]+)/(?<port>\d+)(?<rest>.*)$ {
    set $backend_path $rest;
    if ($app = jupyter) {
        set $backend_path /$app/$node/$port$rest;
    }
    proxy_pass http://$node.ihep.ac.cn:$port$backend_path$is_args$args;

    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding gzip;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout    2400s;
    proxy_send_timeout    2400s;
    proxy_connect_timeout 2400s;
    keepalive_timeout     2400s;
}
