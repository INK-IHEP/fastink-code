location ~ ^/(?<jobtype>herddisplay)/(?<node>[^/]+)/(?<port>\d+)/(?<inkuser>[\w\.]+)(?:/(?<rest>.*))?$ {
    proxy_pass http://$node.ihep.ac.cn:$port$request_uri;

    proxy_set_header Host $http_host;
    proxy_set_header Ink-Username $http_ink_username;
    proxy_set_header Ink-Token $http_ink_token;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding gzip;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    proxy_read_timeout    2400s;
    proxy_send_timeout    2400s;
    proxy_connect_timeout 2400s;
    keepalive_timeout     2400s;
}
