location ~ ^/jupyter/(?<node>[^/]+)/(?<port>\d+)(?<rest>.*)$ {
    # jupyter server expects its full request URI to include the /jupyter/host/port
    # prefix so URLs it generates internally keep working through the proxy.
    proxy_pass http://$node{{ node_domain_suffix }}:$port/jupyter/$node/$port$rest$is_args$args;

    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding gzip;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout    2400s;
    proxy_send_timeout    2400s;
    proxy_connect_timeout 2400s;
    keepalive_timeout     2400s;
}
