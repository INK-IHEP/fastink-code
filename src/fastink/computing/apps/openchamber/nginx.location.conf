# Session-based proxy — OpenResty 8446 → backend nginx → worker.
#
# OpenResty encodes <host>/<port>/<path> in the URL; this location
# unpacks them and proxies to the worker at / (no --base-path needed).
# Matches: /internal/job-proxy/<host>/<port>/<path...>
location ~ ^/internal/job-proxy/(?<proxy_host>[^/]+)/(?<proxy_port>\d+)/(?<proxy_rest>.*) {
    proxy_pass http://$proxy_host{{ node_domain_suffix }}:$proxy_port/$proxy_rest$is_args$args;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $http_host;

    proxy_buffering off;
    proxy_read_timeout    2400s;
    proxy_send_timeout    2400s;
    proxy_connect_timeout 2400s;
}
